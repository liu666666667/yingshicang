<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>影视仓 · 线路中心</title>
<style>
:root{
  --bg:#0b1020; --bg2:#111a30; --card:rgba(255,255,255,.045);
  --card-h:rgba(255,255,255,.075); --line:rgba(255,255,255,.09);
  --txt:#e8edf7; --sub:#93a1bd; --mut:#63718f;
  --acc:#4de2c0; --acc2:#7c8cff; --movie:#4de2c0; --agent:#7c8cff; --live:#ffb454;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(1200px 600px at 15% -10%,#1b2a4a 0%,transparent 60%),
             radial-gradient(900px 500px at 100% 0%,#2a1b4a 0%,transparent 55%),
             var(--bg);
  color:var(--txt);min-height:100vh;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1040px;margin:0 auto;padding:32px 20px 60px}
header{text-align:center;padding:18px 0 26px}
.badge{display:inline-block;font-size:12px;letter-spacing:2px;color:var(--acc);
  border:1px solid rgba(77,226,192,.3);border-radius:20px;padding:4px 14px;margin-bottom:16px}
h1{font-size:30px;font-weight:700;letter-spacing:1px;
  background:linear-gradient(90deg,#4de2c0,#7c8cff 70%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--sub);font-size:14px;margin-top:10px}
.syncbar{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
  margin-top:16px;font-size:12px;color:var(--mut)}
.syncdot{width:7px;height:7px;border-radius:50%;background:var(--live);
  box-shadow:0 0 8px var(--live);flex:none}
.syncdot.ok{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.syncbtn{background:none;border:1px solid var(--line);color:var(--sub);border-radius:7px;
  padding:3px 10px;font-size:11px;cursor:pointer;margin-left:4px}
.syncbtn:hover{color:var(--acc);border-color:rgba(77,226,192,.4)}
.stats{display:flex;justify-content:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 20px;min-width:96px}
.stat b{display:block;font-size:22px;color:var(--txt)}
.stat span{font-size:12px;color:var(--mut)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0 22px}
.tab{background:var(--card);border:1px solid var(--line);color:var(--sub);
  padding:8px 16px;border-radius:10px;font-size:13px;cursor:pointer;transition:.18s;
  user-select:none}
.tab:hover{background:var(--card-h);color:var(--txt)}
.tab.on{background:linear-gradient(90deg,rgba(77,226,192,.18),rgba(124,140,255,.18));
  border-color:rgba(77,226,192,.45);color:#fff}
.bar{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.search{flex:1;min-width:180px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:10px 14px;color:var(--txt);font-size:14px;outline:none}
.search:focus{border-color:rgba(77,226,192,.5)}
.search::placeholder{color:var(--mut)}
.btn{background:var(--card);border:1px solid var(--line);color:var(--sub);
  padding:10px 16px;border-radius:10px;font-size:13px;cursor:pointer;transition:.18s;
  white-space:nowrap}
.btn:hover{background:var(--card-h);color:#fff}
.btn.pri{background:linear-gradient(90deg,rgba(77,226,192,.2),rgba(124,140,255,.2));
  border-color:rgba(77,226,192,.4);color:#dffcf4}
.group{margin-bottom:30px}
.ghead{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:0 4px}
.gtitle{font-size:17px;font-weight:600;display:flex;align-items:center;gap:9px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.movie{background:var(--movie);box-shadow:0 0 10px var(--movie)}
.dot.agent{background:var(--agent);box-shadow:0 0 10px var(--agent)}
.dot.live{background:var(--live);box-shadow:0 0 10px var(--live)}
.gdesc{color:var(--mut);font-size:12px}
.gcount{margin-left:auto;color:var(--mut);font-size:12px}
.gcopy{background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;
  padding:5px 12px;font-size:12px;cursor:pointer;transition:.18s}
.gcopy:hover{color:var(--acc);border-color:rgba(77,226,192,.4)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;transition:.18s}
.item:hover{background:var(--card-h);border-color:rgba(255,255,255,.16);transform:translateY(-1px)}
.ihead{display:flex;align-items:center;gap:10px}
.idx{color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums;min-width:22px}
.iname{font-size:14px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iurl{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;
  color:var(--mut);margin:8px 0 0 32px;word-break:break-all;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.iacts{display:flex;gap:8px;margin:10px 0 0 32px}
.mini{background:none;border:1px solid var(--line);color:var(--sub);border-radius:7px;
  padding:4px 11px;font-size:12px;cursor:pointer;transition:.18s}
.mini:hover{color:#fff;border-color:rgba(255,255,255,.25)}
.mini.c{color:var(--acc)}
.mini.c:hover{border-color:rgba(77,226,192,.5);background:rgba(77,226,192,.08)}
.pled{width:9px;height:9px;border-radius:50%;flex:none;background:var(--mut)}
.pled.loading{background:var(--live);box-shadow:0 0 8px var(--live);animation:blink .8s infinite}
.pled.ok{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.pled.fail{background:#ff5c6c;box-shadow:0 0 8px #ff5c6c}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.probeinfo{font-size:12px;color:var(--mut);align-self:center;white-space:nowrap}
.probehint{font-size:11px;color:var(--mut);text-align:center;margin:-10px 0 18px}
.empty{text-align:center;color:var(--mut);padding:60px 0;font-size:14px}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:50px;line-height:1.9}
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);
  background:rgba(20,30,50,.96);border:1px solid rgba(77,226,192,.4);color:#dffcf4;
  padding:11px 22px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;
  transition:.25s;z-index:99;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){h1{font-size:24px}.list{grid-template-columns:1fr}.stat{min-width:80px;padding:10px 14px}}
</style>
</head>

      html+='<div class="item">'+
        '<div class="ihead"><span class="'+ledCls(it.u)+'" data-led="'+encodeURIComponent(it.u)+'" title="线路状态灯"></span>'+
        '<span class="idx">'+String(i+1).padStart(2,'0')+'</span>'+
        '<span class="iname" title="'+esc(it.n)+'">'+esc(it.n)+'</span></div>'+
        '<div class="iurl" title="'+esc(it.u)+'">'+esc(it.u)+'</div>'+
        '<div class="iacts">'+
          '<button class="mini c" data-copy="'+safe+'">复制地址</button>'+
          '<a class="mini" href="'+esc(it.u)+'" target="_blank" rel="noopener">打开</a>'+
        '</div></div>';
    });
    html+='</div></div>';
  });
  document.getElementById('content').innerHTML=any?html:'<div class="empty">没有匹配的线路</div>';
  bind();
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function bind(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-copy]'),function(b){
    b.onclick=function(){copy(decodeURIComponent(b.getAttribute('data-copy')),'订阅地址已复制')};
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-all]'),function(b){
    b.onclick=function(){copy(decodeURIComponent(b.getAttribute('data-all')),'整组地址已复制')};
  });
}
document.getElementById('search').oninput=function(e){kw=e.target.value.trim();render()};
document.getElementById('copyAll').onclick=function(){
  var arr=[];
  visibleGroups().forEach(function(g){
    g.items.forEach(function(it){
      if(!kw|| (it.n+' '+it.u).toLowerCase().indexOf(kw.toLowerCase())>=0) arr.push(it.u);
    });
  });
  if(!arr.length){toast('没有可复制的地址');return}
  copy(arr.join('\n'),'已复制 '+arr.length+' 条地址');
};
document.getElementById('syncbtn').onclick=function(){syncFromRepo(true)};
document.getElementById('probeAll').onclick=probeAll;
initStats();initTabs();render();
syncFromRepo(false);                       // 打开即同步最新
setInterval(function(){syncFromRepo(false)},5*60*1000); // 页面常开时每5分钟自动同步
document.addEventListener('visibilitychange',function(){
  if(!document.hidden) syncFromRepo(false); // 切回页面时同步
});
</script>
